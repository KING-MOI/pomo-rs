[package]
name = "pomo-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A minimal pomodoro timer for the terminal"
license = "MIT"
authors = ["Aditya Verma"]
repository = "https://github.com/OWNER/pomo-rs"
readme = "README.md"
keywords = ["pomodoro", "timer", "cli", "productivity", "focus"]
categories = ["command-line-utilities"]

[[bin]]
name = "pomo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.8", features = ["derive"] }
clap_complete = "4.6.12"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
