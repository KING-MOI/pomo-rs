[package]
name = "pomo-rs"
version = "0.1.0"
edition = "2024"
description = "A minimal pomodoro timer for the terminal"
license = "MIT"
authors = ["Aditya Verma"]

[[bin]]
name = "pomo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.8", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
