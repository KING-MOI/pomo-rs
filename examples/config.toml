# pomo config. Every key is optional; missing keys use the defaults below.
# Durations accept plain minutes (25) or strings like "25m", "1h30m", "90s".

work = "25m"
short_break = "5m"
long_break = "15m"

# a long break replaces every Nth short break
long_break_every = 4

# full work sessions to aim for each day (0 = no goal)
daily_goal = 0

# notify if the timer stays paused this long ("0" = never)
pause_reminder = "0s"

# keep counting past zero at the end of work until you press a key
overtime = false

# start the next session right away; false waits for a keypress
auto_start = true
# set this to start breaks right away even when auto_start is false
# auto_start_breaks = true

# "plain" countdown or "bar" for a progress bar
display = "plain"
# cells in the bar; 0 sizes it to the terminal
bar_width = 24
# "smooth", "blocks" or "ascii"
bar_style = "smooth"
color = true

# show the countdown in the terminal window title
title = false

# "auto", "osc9", "terminal-notifier", "bell" or "none"
notify = "auto"

# sound for terminal-notifier, any name from /System/Library/Sounds
# sound = "Glass"

# where sessions are logged (default: ~/.local/share/pomo/sessions.log)
# log_file = "~/notes/pomo.log"

# shell command run after every session; gets POMO_KIND, POMO_OUTCOME,
# POMO_SECONDS and POMO_TASK in its environment
# hook = "say \"$POMO_KIND $POMO_OUTCOME\""
